# The development database. `npm run dev` brings this up first.
services:
  postgres:
    image: postgres:16
    container_name: ai-automation-db
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: automation
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # Docker will not report the container "ready" until Postgres actually
    # answers, so `npm run dev` never races ahead of the database on a cold laptop.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
