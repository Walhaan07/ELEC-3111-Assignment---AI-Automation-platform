# The development database.
#
#   docker compose up -d --wait     start it (once)
#   docker compose ps               is it running?
#   docker compose down             stop it, keeping the data
#   docker compose down -v          stop it and wipe the data
services:
  postgres:
    image: postgres:16
    container_name: ai-automation-db
    # Comes back by itself when Docker Desktop starts, so the daily routine is
    # `npm run dev` and nothing else. `docker compose down` still stops it.
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: automation
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    # Docker will not report the container "ready" until Postgres actually
    # answers, so `npm run dev` never races ahead of the database on a cold laptop.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automation"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: {}
